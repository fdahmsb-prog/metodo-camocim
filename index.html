<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Método Camocim Concursos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: cartão-resposta — barra lateral de navegação + área de trabalho; no celular, navegação inferior */
:root{
  --paper:#f3f5f7; --card:#ffffff; --ink:#14213d; --muted:#5b6578; --line:#dde2ea;
  --petrol:#1d5c63; --petrol-ink:#ffffff; --petrol-soft:#e3eff0;
  --mark:#f2c230; --mark-soft:#fdf3cf;
  --ok:#17803d; --ok-soft:#e3f4e8; --bad:#b4232a; --bad-soft:#fbe6e7;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --law:"IBM Plex Serif", Georgia, serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1520; --card:#172030; --ink:#e7ecf3; --muted:#9aa6b8; --line:#2a3546;
    --petrol:#3f9aa3; --petrol-ink:#08171a; --petrol-soft:#1b3438;
    --mark:#f2c230; --mark-soft:#3a3214;
    --ok:#4ccf7a; --ok-soft:#14321f; --bad:#ff6b72; --bad-soft:#3a1a1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1520; --card:#172030; --ink:#e7ecf3; --muted:#9aa6b8; --line:#2a3546;
  --petrol:#3f9aa3; --petrol-ink:#08171a; --petrol-soft:#1b3438;
  --mark:#f2c230; --mark-soft:#3a3214;
  --ok:#4ccf7a; --ok-soft:#14321f; --bad:#ff6b72; --bad-soft:#3a1a1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
nav.side{background:var(--ink);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
:root[data-theme="dark"] nav.side{background:#0a0f17}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.side{background:#0a0f17}}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.brand .dot{width:34px;height:34px;border-radius:50%;background:var(--mark);display:grid;place-items:center;color:#14213d;font:800 15px var(--display)}
.brand b{font:800 17px/1.1 var(--display);display:block}
.brand small{opacity:.65;font-size:12px}
nav.side a{color:#d6dce6;text-decoration:none;padding:9px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;font-weight:500}
nav.side a:hover{background:rgba(255,255,255,.07);color:#fff}
nav.side a.on{background:rgba(242,194,48,.16);color:#fff;box-shadow:inset 3px 0 0 var(--mark)}
nav.side a .n{margin-left:auto;background:var(--mark);color:#14213d;font-size:11px;font-weight:600;border-radius:99px;padding:0 7px;font-variant-numeric:tabular-nums}
nav.side .foot{margin-top:auto;font-size:12px;opacity:.55;padding:8px 12px}
main{padding:28px clamp(16px,3vw,40px) 90px;max-width:1100px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font:800 30px/1.1 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--petrol);border-radius:99px}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;gap:7px;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--petrol)}
.btn.pri{background:var(--petrol);color:var(--petrol-ink);border-color:var(--petrol)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.mark{background:var(--mark);color:#14213d;border-color:var(--mark)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=password],input[type=search],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0}
textarea{width:100%;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--petrol-soft);color:var(--ink);font-weight:500;white-space:nowrap}
.chip.mk{background:var(--mark-soft)}
.chip.okc{background:var(--ok-soft);color:var(--ok)}
.chip.badc{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:13px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
/* Questão */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.q .meta{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 18px;background:var(--petrol-soft);font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.q .meta b{color:var(--ink);font-weight:600}
.q .body{padding:18px}
.q .enun{font-size:15.5px;white-space:pre-wrap}
.q .enun .item{display:block;margin-top:10px;padding:12px 14px;border-left:3px solid var(--mark);background:var(--mark-soft);border-radius:0 8px 8px 0;font-family:var(--law)}
.alts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.alt{display:grid;grid-template-columns:34px 1fr 30px;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--card);text-align:left}
.alt:hover{border-color:var(--petrol)}
.alt .bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:600;font-size:13px}
.alt.sel{border-color:var(--petrol);background:var(--petrol-soft)}
.alt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.alt.cut .txt{text-decoration:line-through;opacity:.45}
.alt .scis{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px;border-radius:6px;font-size:15px}
.alt .scis:hover{color:var(--ink);background:var(--line)}
.alt.right{border-color:var(--ok);background:var(--ok-soft)}
.alt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.alt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.ce{display:flex;gap:10px;margin-top:16px}
.ce .alt{grid-template-columns:34px auto;min-width:130px}
.res{margin-top:14px;padding:11px 14px;border-radius:8px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res.ok{background:var(--ok-soft);color:var(--ok)}
.res.bad{background:var(--bad-soft);color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--mark)}
.pane{padding:14px 2px 2px;white-space:pre-wrap}
.pane.law{font-family:var(--law);font-size:15px}
.pane.np{white-space:normal}
.fc{padding:10px 0;border-bottom:1px solid var(--line)}
.fc:first-child{padding-top:0}
.fct{white-space:pre-wrap;margin-top:4px}
.qfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
/* Simulado */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.sheet button{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-variant-numeric:tabular-nums;font-size:13px}
.sheet button.ans{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sheet button.cur{outline:3px solid var(--mark)}
.sheet button.r{background:var(--ok);color:#fff;border-color:var(--ok)}
.sheet button.w{background:var(--bad);color:#fff;border-color:var(--bad)}
.timer{font:800 26px var(--display);font-variant-numeric:tabular-nums}
/* Legislação */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;background:var(--card);cursor:pointer}
.drop.over{border-color:var(--petrol);background:var(--petrol-soft)}
.doc{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.reader{font-family:var(--law);font-size:16px;line-height:1.7;max-width:70ch;white-space:pre-wrap}
.reader mark{background:var(--mark);color:#14213d}
.reader .art{font-weight:600;scroll-margin-top:20px}
.arts{display:flex;flex-wrap:wrap;gap:6px;max-height:140px;overflow:auto}
.list{display:flex;flex-direction:column}
.list > div{padding:10px 0;border-bottom:1px solid var(--line)}
.list > div:last-child{border-bottom:0}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbars .l{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.cols{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--line);padding-top:8px}
.cols div{flex:1;background:var(--petrol);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.cols div.today{background:var(--mark)}
.colx{display:flex;gap:6px;font-size:11px;color:var(--muted);margin-top:4px}
.colx span{flex:1;text-align:center;font-variant-numeric:tabular-nums}
/* Modal e toast */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal .box{background:var(--card);border-radius:12px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:22px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;display:none;max-width:90vw}
.toast.on{display:block}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--mark);transition:width .3s}
.empty{padding:30px;text-align:center;color:var(--muted)}
.notice{background:var(--mark-soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13.5px}
code{background:var(--petrol-soft);padding:1px 5px;border-radius:4px;font-size:12.5px}
pre.code{background:var(--petrol-soft);padding:12px;border-radius:8px;overflow:auto;font-size:12.5px;white-space:pre}
nav.bottom{display:none}
[hidden]{display:none!important}
#gate{min-height:100%;display:grid;place-items:center;grid-template-columns:minmax(0,420px);justify-content:center;padding:24px 16px;background:var(--ink)}
#gate .box{background:var(--card);border-radius:14px;padding:28px;max-width:420px;width:100%;border:1px solid var(--line)}
#gate .brand{padding:0 0 18px;color:var(--ink)}
#gate .tabs{margin:0 0 16px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th{font-size:12.5px;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);z-index:40;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.bottom a{color:#cfd6e1;text-decoration:none;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:8px;min-width:54px}
  nav.bottom a.on{color:var(--mark)}
  nav.bottom svg{width:22px;height:22px}
  main{padding-top:20px}
  h1{font-size:24px}
  .ce .alt{min-width:0;flex:1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="gate" hidden></div>
<div class="app" id="app" hidden>
  <nav class="side" id="sidenav" aria-label="Navegação principal"></nav>
  <main id="main"></main>
</div>
<nav class="bottom" id="bottomnav" aria-label="Navegação"></nav>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalbox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=2"></script>
<script>
"use strict";
/* ============================================================
   Método Camocim Concursos — app de questões
   Dados guardados no navegador (IndexedDB, com localStorage de reserva)
   ============================================================ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const DAY = 86400000;
const LETRAS = ["A","B","C","D","E"];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const dayKey = t => { const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };

const ICONS = {
  inicio: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  questoes: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  simulado: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
  revisao: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  legislacao: '<path d="M4 4h10l6 6v10a1 1 0 0 1-1 1H4z"/><path d="M14 4v6h6M8 14h8M8 17h6"/>',
  desempenho: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  admin: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  ajustes: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>'
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;

/* ---------------- Nuvem (Supabase) ---------------- */
// Valores públicos embutidos (iguais aos do config.js), para o app funcionar mesmo se o config.js não carregar
const CFG_PADRAO = { supabaseUrl: "https://dipobcbjpqpgpxejnnvh.supabase.co", supabaseAnonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpcG9iY2JqcHFwZ3B4ZWpubnZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MDkzNjYsImV4cCI6MjExMDA4NTM2Nn0.oRR5gPyoMFgXjAcFbPdQ1PMLQ7tqFMDeIOpTo0zW6Uk", apiGerar: "/api/gerar", contato: "WhatsApp (95) 99121-8946" };
const CFG = { ...CFG_PADRAO, ...Object.fromEntries(Object.entries(window.CAMOCIM_CONFIG || {}).filter(([, v]) => v !== "" && v !== undefined)) };
let sb = null, ME = null, PROFILE = null;
const isAdmin = () => PROFILE && PROFILE.role === "admin";
const canEdit = q => isAdmin() || (ME && q.owner === ME.id);
const DEFAULT_SETTINGS = { nome: "", meta: 20, penal: true, tema: "auto" };
let S = { questions: [], docs: [], answers: {}, review: {}, flags: {}, notes: {}, simulados: [], settings: { ...DEFAULT_SETTINGS } };
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const dados = { answers: S.answers, review: S.review, flags: S.flags, notes: S.notes, simulados: S.simulados, settings: S.settings };
    try { localStorage.setItem("camocim_cache_" + ME.id, JSON.stringify(dados)); } catch (e) {}
    const { error } = await sb.from("estado").upsert({ user_id: ME.id, dados, atualizado_em: new Date().toISOString() });
    if (error) toast("Não consegui salvar seu progresso na nuvem. Verifique a internet.");
  }, 800);
}
const rowToQ = r => ({ ...r.dados, id: r.id, owner: r.owner, criada: Date.parse(r.criado_em) });
const qToDados = q => { const { id, owner, criada, docId, ...d } = q; if (docId) d.docId = docId; return d; };
async function fetchAll(table, cols, order) {
  const out = []; const P = 1000;
  for (let from = 0; ; from += P) {
    const { data, error } = await sb.from(table).select(cols).order(order || "criado_em").range(from, from + P - 1);
    if (error) throw error; out.push(...data); if (data.length < P) break;
  }
  return out;
}
async function loadAll() {
  const [qs, est, docs] = await Promise.all([
    fetchAll("questoes", "id,owner,dados,criado_em"),
    sb.from("estado").select("dados").eq("user_id", ME.id).maybeSingle(),
    fetchAll("documentos", "id,nome,texto,disciplina,criado_em")
  ]);
  S.questions = qs.map(rowToQ);
  S.docs = docs.map(d => ({ id: d.id, nome: d.nome, texto: d.texto, disciplina: d.disciplina || "", data: Date.parse(d.criado_em) }));
  const st = (est.data && est.data.dados) || {};
  S.answers = st.answers || {}; S.review = st.review || {}; S.flags = st.flags || {}; S.notes = st.notes || {}; S.simulados = st.simulados || [];
  S.settings = { ...DEFAULT_SETTINGS, ...(st.settings || {}), nome: PROFILE.nome || (st.settings && st.settings.nome) || "" };
}
async function insertQuestions(list, global) {
  const rows = list.map(q => ({ owner: global ? null : ME.id, dados: qToDados(q) })); const out = [];
  for (let i = 0; i < rows.length; i += 200) {
    const { data, error } = await sb.from("questoes").insert(rows.slice(i, i + 200)).select("id,owner,dados,criado_em");

      }

        const errada = incorreta ? !a.wrong : !a.ok;
        if (incorreta) return `${LETRAS[k]}) ${a.wrong ? "INCORRETA (gabarito): no " + a.u.label + " consta “" + a.m.de + "”, e não “" + a.m.para + "”." : "Correta: reproduz o " + a.u.label + "."}`;
        return `${LETRAS[k]}) ${a.ok ? "Correta (gabarito): reproduz o " + a.u.label + "." : "Errada: no " + a.u.label + " consta “" + a.m.de + "”, e não “" + a.m.para + "”."}`;
      });

    const resHTML = answered ? `<div class="res ${right ? "ok" : "bad"}">${sel === null || sel === undefined ? "Em branco." : right ? "Você acertou!" : "Você errou."} Gabarito: ${q.tipo === "CE" ? (gab === "C" ? "Certo" : "Errado") : LETRAS[+gab]}</div>
      <div class="tabs" role="tablist">${[["comentario", "Comentário"], ["fundamento", "Fundamento legal"], ["forum", "Fórum" + (forum.count ? ` (${forum.count})` : "")], ["nota", "Minhas anotações"], ["hist", "Histórico"]].map(([k, l]) => `<button role="tab" class="${tab === k ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>
      <div class="pane ${tab === "fundamento" ? "law" : ""} ${tab === "forum" ? "np" : ""}">${tab === "forum" ? forumHTML() : tab === "comentario" ? esc(q.comentario || "Sem comentário cadastrado.") : tab === "fundamento" ? esc(q.fundamento || "Sem fundamento cadastrado.") : tab === "nota" ? `<textarea id="nota-${q.id}" rows="4" placeholder="Escreva um macete, um resumo ou o motivo do erro.">${esc(S.notes[q.id] || "")}</textarea><div class="row" style="margin-top:8px"><button class="btn sm pri" data-act="savenote">Salvar anotação</button></div>` : histHTML()}</div>` : "";
    host.innerHTML = `<article class="q">
      <div class="meta">${opts.num ? `<span><b>Questão ${opts.num}${opts.total ? " de " + opts.total : ""}</b></span>` : ""}${metaLine(q)}</div>
      <div class="body"><div class="enun">${enunHTML(q)}</div>${optsHTML}${resHTML}</div>
      <div class="qfoot"><div class="row">
        ${opts.simulado ? "" : answered ? `<button class="btn" data-act="again">Refazer</button>` : `<button class="btn pri" data-act="answer" ${sel === null || sel === undefined ? "disabled" : ""}>Responder</button>`}
        <button class="btn ghost sm" data-act="flag" aria-pressed="${!!S.flags[q.id]}">${S.flags[q.id] ? "★ Marcada" : "☆ Marcar para revisar"}</button>
        ${canEdit(q) ? `<button class="btn ghost sm" data-act="edit">Editar</button>` : ""}
      </div><span class="small muted">${prev.length ? `Você já resolveu ${prev.length}× · acertou ${okc}` : "Inédita para você"}</span></div>
    </article>`;
  }
  function histHTML() {
    const arr = S.answers[q.id] || []; if (!arr.length) return "Ainda sem tentativas.";
    return arr.slice(-10).reverse().map(a => `${new Date(a.t).toLocaleString("pt-BR")} — ${a.ok ? "acertou" : "errou"} (marcou ${q.tipo === "CE" ? a.r : LETRAS[+a.r] || "-"})`).join("\n");
  }
  host.onclick = e => {
    const cutB = e.target.closest("[data-cut]");
    if (cutB) { e.stopPropagation(); const i = +cutB.dataset.cut; cut.has(i) ? cut.delete(i) : cut.add(i); draw(); return; }
    const alt = e.target.closest(".alt[data-v]");
    if (alt && !answered) { const v = q.tipo === "CE" ? alt.dataset.v : +alt.dataset.v; sel = String(sel) === String(v) && opts.simulado ? null : v; if (opts.simulado) opts.simulado.set(sel); draw(); return; }
    const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; if (tab === "forum" && !forum.list && !forum.loading) loadForum(); else draw(); return; }
    const dc = e.target.closest("[data-delc]");
    if (dc) { if (!dc.dataset.c) { dc.dataset.c = 1; dc.textContent = "Confirmar exclusão"; return; } dc.disabled = true; sb.from("comentarios").delete().eq("id", dc.dataset.delc).then(({ error }) => { if (error) { toast("Não consegui excluir: " + error.message); dc.disabled = false; return; } forum.list = forum.list.filter(c => c.id !== dc.dataset.delc); forum.count = forum.list.length; draw(); toast("Comentário excluído."); }); return; }
    const a = e.target.closest("[data-act]"); if (!a) return;
    const act = a.dataset.act;
    if (act === "answer" && sel !== null && sel !== undefined) { const ok = registrar(q, sel); answered = true; draw(); renderNav(); opts.onAnswer && opts.onAnswer(ok); }
    if (act === "again") { answered = false; sel = null; cut.clear(); draw(); }
    if (act === "flag") { if (S.flags[q.id]) delete S.flags[q.id]; else S.flags[q.id] = true; save(); draw(); }
    if (act === "postc") {
      const ta = $("#fc-" + q.id); const texto = ta.value.trim();
      if (texto.length < 2) { toast("Escreva o comentário antes de publicar."); return; }
      a.disabled = true;
      sb.from("comentarios").insert({ questao_id: q.id, texto }).select("id,user_id,autor_nome,autor_admin,texto,criado_em").single().then(({ data, error }) => {
        if (error) { a.disabled = false; toast("Não consegui publicar: " + error.message); return; }
        forum.list = [...(forum.list || []), data]; forum.count = forum.list.length; draw(); toast("Comentário publicado.");
      });
    }
    if (act === "savenote") { S.notes[q.id] = $("#nota-" + q.id).value; save(); toast("Anotação salva."); }
    if (act === "edit") editQuestion(q, () => draw());
  };
  host.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("alt") && e.target.tagName !== "BUTTON") { e.preventDefault(); e.target.click(); } };
  draw();
}

function discBars(st, max) {

const uniq = k => [...new Set(S.questions.map(q => q[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));

function editQuestion(q, done) {

      <datalist id="dl-banca">${["CEBRASPE", "FGV", "FCC", "VUNESP", "CESGRANRIO", "IBFC", "IDECAN", "Quadrix", "AOCP"].map(x => `<option value="${x}">`).join("")}</datalist>

    } catch (e) { btn.disabled = false; toast("Não consegui salvar: " + e.message); return; }
    closeModal(); toast(novo ? "Questão cadastrada." : "Questão atualizada."); renderNav(); done && done();
  };
}

/* ---------------- Tela: Simulado ---------------- */
let SIM = null; let simTick = null;
function startSim({ n, disc, tempo, banca, origem }) {
  let pool = S.questions.filter(q => (!disc || q.disciplina === disc) && (!banca || q.banca === banca) && (!origem || q.origem === origem));
  pool = shuffle(pool).slice(0, n);
  if (!pool.length) { toast("Não há questões para esse simulado."); return false; }
  SIM = { ids: pool.map(q => q.id), resp: {}, i: 0, start: Date.now(), limit: tempo ? tempo * 60000 : 0, done: false, disc };
  return true;
}
function vSimulado(m) {
  clearInterval(simTick);

/* ---------------- Tela: Desempenho ---------------- */
function vDesempenho(m) {

  const maxD = Math.max(1, ...dias.map(x => st.porDia[x.k] || 0));

  const fracos = Object.entries(ass).filter(([, v]) => v.t >= 2).sort((a, b) => a[1].ok / a[1].t - b[1].ok / b[1].t).slice(0, 6);
  m.innerHTML = `<div class="head"><div><h1>Desempenho</h1><p>Onde você está forte e o que precisa de reforço.</p></div></div>
    <div class="grid g4"><div class="card tile"><div class="k">Resoluções</div><div class="v">${st.tot}</div></div><div class="card tile"><div class="k">Acerto geral</div><div class="v">${pct(st.ok, st.tot)}%</div></div><div class="card tile"><div class="k">Simulados feitos</div><div class="v">${S.simulados.length}</div></div><div class="card tile"><div class="k">Sequência</div><div class="v">${st.streak} d</div></div></div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h2 style="margin-bottom:12px">Questões por dia (14 dias)</h2><div class="cols">${dias.map((x, i) => `<div class="${i === 13 ? "today" : ""}" style="height:${Math.round(100 * (st.porDia[x.k] || 0) / maxD)}%" title="${x.d.toLocaleDateString("pt-BR")}: ${st.porDia[x.k] || 0}"></div>`).join("")}</div><div class="colx">${dias.map(x => `<span>${x.d.getDate()}</span>`).join("")}</div><div class="small muted" style="margin-top:6px">Pico: ${maxD} questões em um dia</div></div>
      <div class="card"><h2 style="margin-bottom:12px">Por disciplina</h2>${discBars(st)}</div>
      <div class="card"><h2 style="margin-bottom:12px">Assuntos para reforçar</h2>${fracos.length ? `<div class="hbars">${fracos.map(([k, v]) => { const p = pct(v.ok, v.t); return `<div><div class="l"><span>${esc(k)}</span><span class="muted">${p}% · ${v.ok}/${v.t}</span></div><div class="bar"><i style="width:${p}%;background:${p >= 70 ? "var(--ok)" : p >= 50 ? "var(--petrol)" : "var(--bad)"}"></i></div></div>`; }).join("")}</div>` : `<div class="empty">Aparece quando houver ao menos 2 resoluções por assunto.</div>`}</div>
      <div class="card"><h2 style="margin-bottom:12px">Evolução nos simulados</h2>${sims.length ? `<div class="cols">${sims.map(s => `<div style="height:${s.pct}%;background:${s.pct >= 70 ? "var(--ok)" : s.pct >= 50 ? "var(--petrol)" : "var(--bad)"}" title="${new Date(s.data).toLocaleDateString("pt-BR")}: ${s.pct}%"></div>`).join("")}</div><div class="colx">${sims.map(s => `<span>${s.pct}%</span>`).join("")}</div>` : `<div class="empty">Faça um simulado para acompanhar sua evolução.</div>`}</div>
    </div>`;
}

const fmtData = d => { const [y, mo, da] = String(d).slice(0, 10).split("-"); return `${da}/${mo}/${y}`; };
const hojeISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function situacao(p) {
  if (p.role === "admin") return ["Administrador", "okc"];
  if (p.status === "bloqueado") return ["Bloqueado", "badc"];
  if (p.status === "pendente") return ["Aguardando liberação", "mk"];
  if (p.validade && p.validade < hojeISO()) return ["Acesso vencido", "badc"];
  return ["Ativo", "okc"];
}
const statusChip = p => { const [t, c] = situacao(p); return `<span class="chip ${c}">${t}</span>`; };
const acessoOk = p => p && (p.role === "admin" || (p.status === "ativo" && (!p.validade || p.validade >= hojeISO())));

/* ---------------- Entrada: login, cadastro e liberação ---------------- */
function gate(html) { $("#app").hidden = true; $("#bottomnav").hidden = true; const g = $("#gate"); g.hidden = false; g.innerHTML = `<div class="box"><div class="brand"><div class="dot">MC</div><div><b>Método Camocim</b><small class="muted">Concursos</small></div></div>${html}</div>`; }
function openApp() { $("#gate").hidden = true; $("#app").hidden = false; $("#bottomnav").hidden = false; render(); }
const contato = () => CFG.contato ? `<p class="small muted">Dúvidas ou pagamento: <b>${esc(CFG.contato)}</b></p>` : "";
function showLogin(aba = "entrar", aviso = "") {
  gate(`<div class="tabs" role="tablist">${[["entrar", "Entrar"], ["criar", "Criar conta"], ["senha", "Esqueci a senha"]].map(([k, l]) => `<button role="tab" class="${aba === k ? "on" : ""}" data-aba="${k}">${l}</button>`).join("")}</div>
  ${aviso ? `<div class="notice" style="margin-bottom:12px">${aviso}</div>` : ""}
  <form id="lf" class="stack" novalidate>
    ${aba === "criar" ? `<label class="f" for="l-nome">Nome completo<input type="text" id="l-nome" autocomplete="name" required></label>` : ""}
    <label class="f" for="l-email">E-mail<input type="text" inputmode="email" id="l-email" autocomplete="email" required></label>
    ${aba !== "senha" ? `<label class="f" for="l-pass">Senha${aba === "criar" ? " (mínimo de 8 caracteres)" : ""}<input type="password" id="l-pass" autocomplete="${aba === "criar" ? "new-password" : "current-password"}" required></label>` : ""}
    <button class="btn pri" type="submit" id="l-go">${aba === "entrar" ? "Entrar" : aba === "criar" ? "Criar conta" : "Enviar link para nova senha"}</button>
    <div class="small" id="l-msg" role="status"></div>
  </form>${contato()}`);
  $$("#gate [data-aba]").forEach(b => b.onclick = () => showLogin(b.dataset.aba));
  $("#lf").onsubmit = async e => {
    e.preventDefault(); const msg = $("#l-msg"); const go = $("#l-go"); const email = $("#l-email").value.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) { msg.textContent = "Digite um e-mail válido."; return; }
    go.disabled = true; msg.textContent = "Aguarde…";
    try {
      if (aba === "entrar") {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: $("#l-pass").value });
        if (error) throw new Error(/invalid/i.test(error.message) ? "E-mail ou senha incorretos." : /confirm/i.test(error.message) ? "Confirme seu e-mail pelo link que enviamos antes de entrar." : error.message);
        await enter(data.user);
      } else if (aba === "criar") {
        const nome = $("#l-nome").value.trim(); const pass = $("#l-pass").value;
        if (nome.length < 3) throw new Error("Digite seu nome.");
        if (pass.length < 8) throw new Error("A senha precisa ter ao menos 8 caracteres.");
        const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { nome }, emailRedirectTo: location.origin } });
        if (error) throw new Error(/registered/i.test(error.message) ? "Este e-mail já tem conta. Use Entrar." : error.message);
        if (data.session) await enter(data.user);
        else showLogin("entrar", "Conta criada. Abra o link que enviamos para o seu e-mail e depois entre com sua senha.");
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
        if (error) throw error;
        msg.textContent = "Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha."; go.disabled = false;
      }
    } catch (err) { msg.textContent = err.message; go.disabled = false; }
  };
}
function newPasswordModal(fromLink) {
  const html = `<h2>Nova senha</h2><form id="np" class="stack" novalidate style="margin-top:12px"><label class="f" for="np-p">Nova senha (mínimo de 8 caracteres)<input type="password" id="np-p" autocomplete="new-password"></label><button class="btn pri" type="submit">Salvar nova senha</button><div class="small" id="np-m" role="status"></div></form>`;
  if (fromLink) gate(html); else modal(html);
  $("#np").onsubmit = async e => {
    e.preventDefault(); const p = $("#np-p").value; if (p.length < 8) { $("#np-m").textContent = "Use ao menos 8 caracteres."; return; }
    const { data, error } = await sb.auth.updateUser({ password: p });
    if (error) { $("#np-m").textContent = error.message; return; }
    if (fromLink) await enter(data.user); else { closeModal(); toast("Senha alterada."); }
  };
}
function showPending() {
  const [t] = situacao(PROFILE);
  const texto = t === "Bloqueado" ? "Seu acesso está bloqueado. Fale com o suporte para regularizar."
    : t === "Acesso vencido" ? `Seu acesso venceu em ${fmtData(PROFILE.validade)}. Renove para continuar estudando; seu histórico fica guardado.`
    : "Cadastro recebido. Assim que o pagamento for confirmado, seu acesso é liberado e você já pode estudar.";
  gate(`<h2>${t}</h2><p>${texto}</p>${contato()}<div class="row" style="margin-top:14px"><button class="btn pri" id="pd-r">Verificar de novo</button><button class="btn ghost" id="pd-o">Sair</button></div>`);
  $("#pd-r").onclick = async () => { await enter(ME); };
  $("#pd-o").onclick = async () => { await sb.auth.signOut(); showLogin(); };
}
async function enter(user) {
  ME = user;
  gate(`<div class="empty">Carregando seus dados…</div>`);
  const { data, error } = await sb.from("profiles").select("id,email,nome,status,role,validade").eq("id", user.id).maybeSingle();
  if (error || !data) { gate(`<p>Não consegui carregar seu perfil${error ? ": " + esc(error.message) : ""}.</p><button class="btn" id="er-o">Sair</button>`); $("#er-o").onclick = async () => { await sb.auth.signOut(); showLogin(); }; return; }
  PROFILE = data;
  if (!acessoOk(PROFILE)) return showPending();
  VIEWS = BASE_VIEWS.filter(v => isAdmin() || v[0] !== "legislacao"); if (isAdmin()) VIEWS.push(["admin", "Administração"]);
  try { await loadAll(); } catch (e) { gate(`<p>Não consegui carregar as questões: ${esc(e.message)}</p><button class="btn pri" id="er-r">Tentar de novo</button>`); $("#er-r").onclick = () => enter(user); return; }
  applyTheme(); openApp();
}
(async function init() {
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) {
    gate(`<h2>Falta configurar</h2><p>O arquivo <code>config.js</code> não foi carregado ou está sem o endereço e a chave pública (anon) do Supabase. O passo a passo está no LEIA-ME.</p><button class="btn pri" onclick="location.reload()">Tentar de novo</button>`);
    return;
  }
  if (!window.supabase) {
    // a biblioteca do Supabase não carregou do primeiro endereço: tenta os reservas
    for (const src of ["https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js", "https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/umd/supabase.js"]) {
      try { await loadScript(src); if (window.supabase) break; } catch (e) {}
    }
  }
  if (!window.supabase) {
    gate(`<h2>Sem conexão com o servidor</h2><p>Não consegui carregar os componentes de login. Verifique a internet ou desative bloqueadores de anúncios para este site e tente de novo.</p><button class="btn pri" onclick="location.reload()">Tentar de novo</button>`);
    return;
  }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  let recovering = /type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange(ev => {
    if (ev === "PASSWORD_RECOVERY") { recovering = true; newPasswordModal(true); }
    if (ev === "SIGNED_OUT") { ME = null; PROFILE = null; }
  });
  const { data } = await sb.auth.getSession();
  if (recovering) return;
  if (!data.session) return showLogin();
  if (/access_token|type=/.test(location.hash)) history.replaceState(null, "", location.pathname);
  await enter(data.session.user);
})();
</script>
</body>
</html>
